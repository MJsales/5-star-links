const catOrder = [
  "Hoodies & Sweaters", "T-Shirts & Polos", "Jeans & Pants", "Shorts",
  "Jackets & Outerwear", "Sets & Suits", "Hats & Accessories", "Other Clothes",
  "Jordan 1", "Jordan 3", "Jordan 4", "Jordan 5", "Jordan 11", "Jordan 14",
  "Nike Dunk", "Air Force 1", "Nike Kobe", "Balenciaga", "LV", "Rick Owens",
  "Amiri", "Bape", "Yeezy", "Off-White", "Other"
];

function getShoesByCat(cat) {
  return shoes.filter(s => s.cat === cat);
}

// The clothing categories, in the order they appear in catOrder. Shoes are
// browsed by scrolling/searching as before; these chips are a quick jump into
// one clothing type. null means "show everything".
const clothesCats = catOrder.slice(0, 8);
let activeCat = null;

function renderChips() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const chip = (label, cat, count) =>
    `<button type="button" class="chip${activeCat === cat ? ' active' : ''}" data-cat="${cat === null ? '' : cat}">` +
    `${label}${count === null ? '' : `<span class="n">${count}</span>`}</button>`;

  let html = chip('All', null, null);
  clothesCats.forEach(cat => {
    const n = getShoesByCat(cat).filter(s => s.name.toLowerCase().includes(q)).length;
    if (n === 0) return;
    html += chip(cat, cat, n);
  });
  const box = document.getElementById('catChips');
  box.innerHTML = html;
  box.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => {
      const c = b.dataset.cat || null;
      activeCat = (activeCat === c) ? null : c;   // clicking the active chip clears it
      render();
    };
  });
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const grid = document.getElementById('shoeGrid');
  const noRes = document.getElementById('noResults');
  let total = 0;
  let html = '';

  catOrder.forEach(cat => {
    if (activeCat && cat !== activeCat) return;
    const filtered = getShoesByCat(cat).filter(s => s.name.toLowerCase().includes(q));
    if (filtered.length === 0) return;
    total += filtered.length;
    html += `<div class="section-label">${cat} <span class="cat-count">${filtered.length}</span></div>`;
    html += `<div class="grid">`;
    filtered.forEach(s => {
      // A few entries point at a Google Sheet rather than a DHGate listing.
      const label = s.link.includes('docs.google.com') ? 'Open Spreadsheet' : 'View on DHGate';
      // Clothing entries carry a price and a sizing note; the shoes carry neither.
      let meta = '';
      if (s.price) meta += `<span class="tag tag-price">${s.price}</span>`;
      if (s.sizing) meta += `<span class="tag tag-size${/UP/i.test(s.sizing) ? ' tag-up' : ''}">${s.sizing}</span>`;
      html += `<div class="card">
        <h3>${s.name}</h3>
        ${meta ? `<div class="tags">${meta}</div>` : ''}
        <a href="${s.link}" target="_blank" rel="noopener noreferrer">${label}</a>
      </div>`;
    });
    html += `</div>`;
  });

  grid.innerHTML = html;
  document.getElementById('totalCount').textContent = total + ' items';
  noRes.classList.toggle('show', total === 0);
  renderChips();
}

function filterShoes() {
  // A search that no longer has hits in the pinned category would look empty,
  // so typing clears the chip rather than silently returning nothing.
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (activeCat && !getShoesByCat(activeCat).some(s => s.name.toLowerCase().includes(q))) activeCat = null;
  render();
}
render();
